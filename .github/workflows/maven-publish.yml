name: Publish Java Package with Maven

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # 可选：将 jar 作为 workflow 产物上传（供下载）
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: metal-mod-jar
          path: target/*.jar

      # 可选：发布到 Maven Central 或 GitHub Packages，请取消注释并配置凭证
      # - name: Publish to GitHub Packages
      #   run: mvn deploy -B -DskipTests --file pom.xml
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 或其它Maven仓库的token
