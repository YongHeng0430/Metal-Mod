name: Publish Java Package with Maven

on:
  push:
    branches: [ main ]          # 也可改成 master 或任意分支
  workflow_dispatch:            # 允许手动触发

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # 写入 GitHub Packages 的权限

    steps:
      # 1. 检出源码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 配置 Maven settings.xml（认证 GitHub Packages）
      - name: Configure Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_USER_REF
          server-password: GITHUB_TOKEN_REF

      # 4. 编译、测试、打包并发布
      - name: Publish to GitHub Packages
        run: mvn --batch-mode clean deploy
        env:
          GITHUB_USER_REF: ${{ github.actor }}
          GITHUB_TOKEN_REF: ${{ secrets.GITHUB_TOKEN }}
